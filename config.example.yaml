# MyWifiControl configuration
# Copy to config.yaml and fill in your AP's SSH details. config.yaml holds
# credentials, so it is git-ignored; keep it chmod 600.

server:
  port: 8084
  # Keep this on 127.0.0.1: the service trusts the hub's X-Hub-Role header,
  # so it must only be reachable through MyHomeServicesHub.
  bind: 127.0.0.1
  # true = requests that bypass the hub are treated as admin (local testing only)
  allow_direct: false
  # Wi-Fi passwords set through the app are saved here, AES-256-GCM encrypted
  # with secret.key (generated on first run). Back both up together; lose the
  # key and the saved passwords are gone.
  secrets_file: secrets.json
  secret_key_file: secret.key

# MariaDB change log: every apply, console session and saved-secret view, shown
# as "Change history" on the page. Without it, changes are only in the journal.
database:
  enabled: true
  host: 127.0.0.1
  port: 3306
  name: wifi_db
  user: wifi_app
  password: "change-me"

access_points:
  - id: house
    name: House AP
    host: 169.254.1.1
    port: 22
    username: admin
    password: "change-me"
    # key_file: /home/myhomeservices/.ssh/cambium_ed25519   # optional, used before password
    # Pin the host key after first connect; the fingerprint is printed in the log:
    #   sudo journalctl -u wifi-control | grep "host key"
    host_key_fingerprint: ""
    profile: cnpilot
    # WLAN profile that carries your SSID ("wireless wlan 1" in show config)
    wlan: 1
    # Which radio index serves which band ("wireless radio 1" / "wireless radio 2")
    radios:
      "2.4": 1
      "5": 2
    timeout_seconds: 10

# Optional: override or add CLI profiles. Every command is a Go text/template line;
